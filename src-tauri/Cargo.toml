[package]
name = "beatmaker-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BeatMaker desktop shell (Tauri 2)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
beatmaker-engine = { path = "../crates/engine" }
beatmaker-io = { path = "../crates/io" }
